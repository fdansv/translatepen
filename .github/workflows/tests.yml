name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-ocr.txt
      - run: python -m unittest discover -s tests -p 'names_dictionary_build.py'
      - run: python -m unittest discover -s tests -p 'ocr_*.py'
      - run: python -m unittest discover -s tests -p 'pen_gateway.py'
      - run: python -m unittest discover -s tests -p 'setup_tools.py'
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y dpkg libisl23 libmpc3 libmpfr6 libgmp10 libzstd1 zlib1g
      - run: python scripts/bootstrap_toolchain.py
      - run: python scripts/build_scan_bridge.py
      - run: python scripts/package_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translatepen-native-mse09
          path: build/translatepen-native-mse09.tar.gz
          if-no-files-found: error
